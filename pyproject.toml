[project]
name = "txstore"
version = "0.1.2"
description = "Unified object storage for Python: one interface over filesystem, S3, and HTTP, with transactions."
authors = [{name = "Václav Vinklát"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
keywords = ["storage", "transaction", "s3", "filesystem", "atomic", "object-storage", "digest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving",
    "Topic :: System :: Filesystems",
    "Typing :: Typed",
]
# Lower bounds track Debian testing → SETUP.md#dependency-policy.
dependencies = [
    "boto3>=1.40,<2",
    "botocore>=1.40,<2",
    "pyxattr>=0.8.1,<0.9",
    "requests>=2.32,<3",
]

[project.urls]
Homepage = "https://github.com/vinklat/txstore"
Source = "https://github.com/vinklat/txstore"
Issues = "https://github.com/vinklat/txstore/issues"
Documentation = "https://github.com/vinklat/txstore/blob/main/docs/guides/README.md"
Changelog = "https://github.com/vinklat/txstore/blob/main/SETUP.md#upgrade-notes"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.11,<1",
    "mypy>=1.20.1,<2",
    "mypy-boto3-s3>=1.40,<2",
    "boto3-stubs>=1.40,<2",
    "types-requests>=2.32,<3",
    "moto[s3,server]>=5.1,<6",
    "responses>=0.25,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "D",   # pydocstyle — Google-style docstrings
    "PT",  # flake8-pytest-style
    "PLC0415", # import-outside-toplevel: local imports only for a named cycle or deferral
    "RUF100",  # unused noqa: every suppression names an enabled rule
]
ignore = [
    "D107",  # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415"]
"scripts/**" = ["D", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["txstore"]

[tool.mypy]
python_version = "3.13"
files = ["src/txstore", "tests", "scripts"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["xattr"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v --strict-markers"
# Non-default: an empty parametrize set fails collection instead of skipping → TESTING.md#harness-and-gates
empty_parameter_set_mark = "fail_at_collect"

[tool.coverage.run]
source = ["txstore"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txstore"]

[tool.hatch.build.targets.sdist]
include = [
    "src/txstore",
    "tests",
    "docs",
    "scripts",
    "/*.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
]
